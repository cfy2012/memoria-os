  .mod rect{fill:rgba(22,27,34,.9);stroke:var(--line);stroke-width:1.3;rx:8}

  .mod.hl rect{stroke:var(--blue);stroke-width:2}

  .mod .msub{fill:var(--dim);font-size:10.5px}
  .pin{cursor:pointer}

  .pin:hover text{fill:var(--txt)}

  .pin.hl .dot{fill:var(--blue);stroke:var(--blue)}

  {a:'g46', b:'e46', group:'ctl', label:'DIN'},
  {a:'g33', b:'ev',  group:'power', label:'3V3'},
  {a:'g34', b:'eg',  group:'gnd', label:'GND'},
  /* ---- 电源链 ---- */
  {a:'usb5v', b:'batp', group:'power', label:'充电'},
  {a:'batp',  b:'boost',group:'power', label:'升压'},
  {a:'boost', b:'v5',   group:'power', label:'5V 轨'},
  {a:'v5',    b:'g35',  group:'power', label:'5V → 核心板'},
  {a:'batn',  b:'g34',  group:'gnd', label:'GND'},
  {a:'pdiv',  b:'g4',   group:'adc', label:'分压 → GPIO4'},
  {a:'pkey',  b:'g2',   group:'ctl', label:'电源键 → GPIO2'}
];

/* 端口索引 */
const PORT = {};
MODULES.forEach(m => m.ports.forEach(p => { p.mod = m.id; PORT[p.id] = p; }));

/* ================= 渲染 ================= */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const netsG = document.getElementById('nets');
const modsG = document.getElementById('mods');

function el(name, attrs, parent){
  const e = document.createElementNS(NS, name);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}

/* 模块内的端口都是模块框边缘上的点：渲染时统一把端口坐标偏移到框的边 */
function portPos(p){
  // 端口定义坐标即实际位置（写在框边），无需偏移
  return {x:p.x, y:p.y};
}

/* 正交折线：芯片左右缘走 650/1150 走廊，跨芯片走上方 340 走廊，深下目标走 1030 走廊 */
function route(a, b){
  const x1=a.x, y1=a.y, x2=b.x, y2=b.y;
  const L=720, R=1080;
  const fromChipL = (x1===L), fromChipR = (x1===R);
  const toChipL = (x2===L), toChipR = (x2===R);
  const crossLeft  = fromChipR && x2 < L;   // 右缘出发 → 左侧目标
  const crossRight = fromChipL && x2 > R;   // 左缘出发 → 右侧目标
  if(crossLeft){
    return `M ${x1} ${y1} L ${1150} ${y1} L ${1150} ${340} L ${x2} ${340} L ${x2} ${y2}`;
  }
  if(crossRight){
    return `M ${x1} ${y1} L ${650} ${y1} L ${650} ${340} L ${x2} ${340} L ${x2} ${y2}`;
  }
  if(fromChipR && y2 > 1000){
    return `M ${x1} ${y1} L ${1150} ${y1} L ${1150} ${1030} L ${x2} ${1030} L ${x2} ${y2}`;
  }
  if(fromChipL || fromChipR){
    const ex = fromChipL ? 650 : 1150;
    return `M ${x1} ${y1} L ${ex} ${y1} L ${ex} ${y2} L ${x2} ${y2}`;
  }
  if(toChipL || toChipR){
    const ex = toChipL ? 650 : 1150;
    return `M ${x1} ${y1} L ${ex} ${y1} L ${ex} ${y2} L ${x2} ${y2}`;
  }
  const d = Math.abs(x2-x1);
  if(d > 260){
    return `M ${x1} ${y1} L ${x2} ${y2}`;
  }
  const mx = (x1+x2)/2;
  return `M ${x1} ${y1} L ${mx} ${y1} L ${mx} ${y2} L ${x2} ${y2}`;
}

/* 建立每个端口 → 连接 的映射 */
const portConns = {};
CONNS.forEach((c,i)=>{
  c.id = 'n'+i;
  (portConns[c.a] = portConns[c.a]||[]).push(c);
  (portConns[c.b] = portConns[c.b]||[]).push(c);
});
/* 模块 → 连接 映射 */
const modConns = {};
CONNS.forEach(c=>{
  const ma = PORT[c.a].mod, mb = PORT[c.b].mod;
  (modConns[ma] = modConns[ma]||[]).push(c);
  if(mb!==ma) (modConns[mb] = modConns[mb]||[]).push(c);
});

/* 画连线 */
CONNS.forEach(c=>{
  const pa = PORT[c.a], pb = PORT[c.b];
  const g = GROUP[c.group] || {color:'#8b949e'};
  const d = route(portPos(pa), portPos(pb));
  const path = el('path', {class:'net', d:d, stroke:g.color, 'data-conn':c.id, 'data-group':c.group}, netsG);
  path.addEventListener('mouseenter', ()=>setFocus(c.id));
  path.addEventListener('click', ()=>setFocus(c.id, true));
});

/* 画模块 + 引脚 */
MODULES.forEach(m=>{
  const g = el('g', {class:'mod', 'data-mod':m.id}, modsG);
  el('rect', {x:m.x, y:m.y, width:m.w, height:m.h}, g);
  el('text', {x:m.x+14, y:m.y+24, class:'mname'}, g).textContent = m.name;
  el('text', {x:m.x+14, y:m.y+42, class:'msub'}, g).textContent = m.sub;
  g.addEventListener('mouseenter', ()=>setFocusMod(m.id));
  g.addEventListener('mouseleave', ()=>clearHover());
  g.addEventListener('click', ()=>setFocusMod(m.id, true));
  m.ports.forEach(p=>{
    const pos = portPos(p);
    const pg = el('g', {class:'pin', 'data-pin':p.id}, g);
    el('circle', {cx:pos.x, cy:pos.y, r:3.2, class:'dot'}, pg);
    const tx = (pos.x <= m.x + m.w/2) ? pos.x - 7 : pos.x + 7;
    const anch = (pos.x <= m.x + m.w/2) ? 'end' : 'start';
    const t = el('text', {x:tx, y:pos.y+3.5, 'text-anchor':anch}, pg);
    t.textContent = p.label;
    pg.addEventListener('mouseenter', ()=>setFocusPin(p.id));
    pg.addEventListener('mouseleave', ()=>clearHover());
  });
});

/* ================= 交互 ================= */
let focused = null;      // 当前聚焦的连接 id 集合
let focusType = null;    // 'conn' | 'mod' | 'pin' | 'group' | null
let pinned = false;
let activeGroup = null;  // 图例过滤的总线组

function applyFilter(){
  document.querySelectorAll('.net').forEach(p=>{
    const c = p.dataset.conn;
    let show = true;
    if(activeGroup && p.dataset.group !== activeGroup) show = false;
    p.style.display = show ? '' : 'none';
  });
  applyHighlight();
}

function applyHighlight(){
  const targets = new Set();
  if(focused){
    if(focusType==='mod'){
      (modConns[focused]||[]).forEach(c=>targets.add(c.id));
    } else if(focusType==='group'){
      CONNS.forEach(c=>{ if(c.group===focused) targets.add(c.id); });
    } else if(focusType==='conn'){
      targets.add(focused);
    }
  }
  document.querySelectorAll('.net').forEach(p=>{
    p.classList.toggle('hl', targets.has(p.dataset.conn));
    p.classList.toggle('dim', targets.size>0 && !targets.has(p.dataset.conn));
  });
  document.querySelectorAll('.mod').forEach(g=>{
    const id = g.dataset.mod;
    const has = modConns[id] && modConns[id].some(c=>targets.has(c.id));
    g.classList.toggle('hl', !!has);
  });
  document.querySelectorAll('.pin').forEach(pg=>{
    const id = pg.dataset.pin;
    const has = (portConns[id]||[]).some(c=>targets.has(c.id));
    pg.classList.toggle('hl', !!has);
  });
}

function setFocus(id, pin){
  focused = id; focusType = 'conn';
  const c = CONNS.find(x=>x.id===id);
  if(c){
    const pa = PORT[c.a], pb = PORT[c.b];
    const L = p=>p.long || p.label;
    showInfo(
      `${GROUP[c.group].name} · ${c.label||''}`,
      `${pa.mod} [${L(pa)}] ─ ${c.label} ─> ${pb.mod} [${L(pb)}]`
    );
  }
  applyHighlight();
}

function setFocusPin(pinId){
  const cs = portConns[pinId]||[];
  const L = p=>p.long || p.label;
  if(cs.length===1){
    focused = cs[0].id; focusType='conn';
    const c = cs[0];
    const pa = PORT[c.a], pb = PORT[c.b];
    showInfo(
      `引脚 ${pinId}`,
      `${L(PORT[pinId])}`,
      `连接：${pa.mod} ↔ ${pb.mod}（${GROUP[c.group].name}）`
    );
  } else if(cs.length>1){
    focused = pinId; focusType='pin';
    const names = cs.map(c=>{
      const other = c.a===pinId ? c.b : c.a;
      return PORT[other].mod;
    }).join('、');
    showInfo(`引脚 ${pinId}（${cs.length} 条连接）`, L(PORT[pinId]), `去向：${names}`);
  } else {
    focused=null; hideInfo();
  }
  applyHighlight();
}

function setFocusMod(id, pin){
  if(focused===id && focusType==='mod' && pin && pinned){
    pinned=false; focused=null; hideInfo(); applyHighlight(); return;
  }
  focused = id; focusType='mod'; pinned = !!pin;
  const m = MODULES.find(x=>x.id===id);
  if(m){
    const cnt = (modConns[id]||[]).length;
    showInfo(`模块：${m.name}`, m.sub, `${cnt} 条连线 · 点引脚看详情`);
  }
  applyHighlight();
}

function clearHover(){
  if(pinned) return;
  focused=null; focusType=null; hideInfo(); applyHighlight();
}

const info = document.getElementById('info');
function showInfo(t, r1, r2){
  info.innerHTML = `<div class="t">${t}</div><div>${r1}</div><div class="r">${r2||''}</div>`;
}
function hideInfo(){ info.innerHTML=''; }

/* 图例 */
const legend = document.getElementById('legend');
Object.keys(GROUP).forEach(k=>{
  const g = GROUP[k];
  const span = document.createElement('span');
  span.className = 'lg'; span.dataset.g = k;
  span.innerHTML = `<span class="dot" style="background:${g.color}"></span>${g.name}`;
  span.addEventListener('click', ()=>{
    if(activeGroup===k){ activeGroup=null; }
    else { activeGroup=k; }
    document.querySelectorAll('.lg').forEach(x=>x.classList.toggle('on', x.dataset.g===activeGroup));
    focused=null; focusType=null; hideInfo();
    applyFilter();
  });
  legend.appendChild(span);
});

/* 模块 chips（移动端/快速定位） */
const chips = document.getElementById('chips');
MODULES.forEach(m=>{
  const b = document.createElement('button');
  b.className='chip'; b.textContent = m.name;
  b.addEventListener('click', ()=>{
    const willOn = !b.classList.contains('on');
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    if(willOn){
      b.classList.add('on');
      setFocusMod(m.id, true);
    } else {
      pinned=false; focused=null; hideInfo(); applyHighlight();
    }
  });
  chips.appendChild(b);
});

/* 缩放 */
let scale = 1;
function setScale(s){
  scale = Math.max(0.4, Math.min(2.2, s));
  const vb = svg.viewBox.baseVal;
  const cw = 1800/scale, ch = 1160/scale;
  const cx = vb.x + vb.width/2, cy = vb.y + vb.height/2;
  vb.x = cx - cw/2; vb.y = cy - ch/2; vb.width = cw; vb.height = ch;
}
document.getElementById('zin').addEventListener('click', ()=>setScale(scale*1.25));
document.getElementById('zout').addEventListener('click', ()=>setScale(scale/1.25));
document.getElementById('zres').addEventListener('click', ()=>{
  const vb = svg.viewBox.baseVal; vb.x=0; vb.y=0; vb.width=1800; vb.height=1160; scale=1;
});
document.getElementById('clear').addEventListener('click', ()=>{
  activeGroup=null; focused=null; pinned=false; hideInfo();
  document.querySelectorAll('.lg').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  applyFilter();
});

/* 画布拖拽平移 */
let drag=null;
svg.addEventListener('mousedown', e=>{ drag={x:e.clientX, y:e.clientY, vx:svg.viewBox.baseVal.x, vy:svg.viewBox.baseVal.y}; });
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  const dx = (e.clientX-drag.x)*1800/svg.clientWidth;
  const dy = (e.clientY-drag.y)*1160/svg.clientHeight;
  const vb = svg.viewBox.baseVal;
  vb.x = drag.vx - dx; vb.y = drag.vy - dy;
});
window.addEventListener('mouseup', ()=>drag=null);
svg.addEventListener('touchstart', e=>{
  if(e.touches.length===1){
    const t=e.touches[0];
    drag={x:t.clientX, y:t.clientY, vx:svg.viewBox.baseVal.x, vy:svg.viewBox.baseVal.y};
  }
}, {passive:true});
svg.addEventListener('touchmove', e=>{
  if(drag && e.touches.length===1){
    e.preventDefault();
    const t=e.touches[0];
    const dx=(t.clientX-drag.x)*1800/svg.clientWidth;
    const dy=(t.clientY-drag.y)*1160/svg.clientHeight;
    const vb=svg.viewBox.baseVal;
    vb.x=drag.vx-dx; vb.y=drag.vy-dy;
  }
}, {passive:false});
svg.addEventListener('touchend', ()=>drag=null);

applyFilter();
</script>
</body>
</html>
